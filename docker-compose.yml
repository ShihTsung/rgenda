version: "3"
services:
  db:
    image: mysql:latest
    command: mysqld --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql:/var/lib/mysql
    container_name: mysqlDB
    privileged: true
    ports:
      - 3306:3306
    env_file:
      - ./.env
    restart: on-failure:3
  nginx:
    container_name: nginx-container
    build: ./nginxconf
    restart: always
    ports:
      # - "8080:80"
      - "80:80"
    volumes:
      - .:/code
      - ./schedule:/code/schedule
      - ./log:/var/log/nginx
    depends_on:
      - app
  app:
    restart: always
    build: ./schedule
    # command: bash -c "cd schedule && python3 manage.py crontab add && python3 manage.py makemigrations && python3 manage.py migrate &&  python3 manage.py runserver 0.0.0.0:80"
    command:
      - /bin/sh
      - -c
      - |
        python3 manage.py collectstatic --noinput
        django-admin compilemessages
        python3 manage.py makemigrations
        python3 manage.py migrate
        uwsgi --ini /code/schedule/uwsgi_conf.ini
    container_name: schedule_web
    volumes:
      - .:/code
      - ./schedule:/code/schedule
    # ports:
    #   - 80:80
    depends_on:
      - db
  cron:
    build: ./schedule
    container_name: cronjob
    command:
      - /bin/sh
      - -c
      - cron -f
    volumes:
      - .:/code
      - ./schedule:/code/schedule
