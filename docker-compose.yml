version: "3"
services:
  db:
    image: mysql:latest
    command: mysqld --default-authentication-plugin=mysql_native_password
    volumes:
      - "./mysql:/var/lib/mysql"
    container_name: mysqlDB
    ports:
      - "3306:3306"
    env_file:
      - ./.env
    restart: always
  app:
    restart: always
    build: . # Current directory!
    command: bash -c "cd schedule && python3 manage.py makemigrations && python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:80"
    container_name: schedule_web
    volumes:
      - .:/code
    ports:
      - "80:80"
    depends_on:
      - db
  