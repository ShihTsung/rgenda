services:
  db:
    image: postgres:16-alpine
    container_name: postgresDB
    restart: on-failure:3
    env_file: .env
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: ./schedule
    container_name: schedule_web
    restart: always
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        python3 manage.py collectstatic --noinput
        django-admin compilemessages
        python3 manage.py migrate --noinput
        gunicorn schedule.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    volumes:
      - .:/code
      - ./schedule:/code/schedule
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: ./nginxconf
    container_name: nginx-container
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/code
      - ./schedule:/code/schedule
      - ./log:/var/log/nginx
    depends_on:
      - app

  cron:
    build: ./schedule
    container_name: cronjob
    restart: always
    env_file: .env
    command:
      - /bin/sh
      - -c
      - cron -f
    volumes:
      - .:/code
      - ./schedule:/code/schedule
    depends_on:
      db:
        condition: service_healthy
