{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block title %}{% trans 'Result' %}{% endblock %}
{% block content %}

<div id="app">
  <pre-result csrf-token="{{ csrf_token }}"></pre-result>
</div>

<script src="{% static 'assets/pre-result.bundle.js' %}"></script>

<style>
  footer {
    position: fixed;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0px 0px 0px 0px !important;
  }
</style>
<script>
  var ox = document.createElement('div');
  var oy = document.createElement('div');
  ox.style.width = '100%';
  ox.style.height = '2px';
  ox.style.backgroundColor = '#46A3FF';
  ox.style.position = 'fixed';
  ox.style.left = 0;
  document.body.appendChild(ox);
  oy.style.height = '100%';
  oy.style.width = '2px';
  oy.style.backgroundColor = '#46A3FF';
  oy.style.position = 'fixed';
  oy.style.top = 0;
  document.body.appendChild(oy);
  document.onmousemove = function(e){
  var e = e || event;
  var x = e.pageX + 10;
  var y = e.pageY + 20;
  ox.style.top = y + 'px';
  oy.style.left = x + 'px';
  };</script>
{% endblock %}
