{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block title %}Date Manage{{LANGUAGE_CODE}}{% endblock %}

{% block content %}
<div class="container">
    <div id="calendar">

    </div>
</div>

<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form action="">
              <div class="form-grounp">
                  <label for="day">type</label>
                <select name="day" id="day" class="form-control">
                    <option value="workday">
                      workday
                    </option> 
                    <option value="holiday">
                      holiday
                    </option> 
                </select>
              </div>
            <br>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="locked">
                <label class="form-check-label" for="locked">locked</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">{%trans 'Cancel'%}</button>
          <button type="button" class="btn btn-primary" onclick="sendData()">{%trans 'Save'%}</button>
        </div>
      </div>
    </div>
  </div>

<script>
    let sendData = function(){

    }
    document.addEventListener('DOMContentLoaded', function () {
        let Calendar = FullCalendar.Calendar;
        let Draggable = FullCalendarInteraction.Draggable;
        let calendarEl = document.getElementById('calendar');
        let initialLocaleCode = 'en';
        let currInfo = {} 
        

        let calendar = new FullCalendar.Calendar(calendarEl, {
                plugins: ['interaction', 'dayGrid'],
                selectable: false,
                selectHelper: true,
                theme: true,
                editable: true,
                themeSystem: 'bootstrap',
                eventLimit: true, // when too many events in a day, show the popover
                timeZone: 'UTC',
                customButtons: {
                    submitButton: {
                        text: '  back  ',
                        click: function () {
                            window.location = "/";
                        }
                    }
                },
                header: {
                    left: '',
                    center: 'title',
                    right: 'prev,next'
                },
                footer: {
                    center: 'submitButton'
                },
                showNonCurrentDates: false,
                droppable: true,
                eventClick: function(info){
                    currInfo = info;
                    $('#exampleModalLabel').text(info.event.start.toISOString().split('T')[0]);
                    console.log($('#exampleModalLabel').text())
                    $('#myModal').modal('show');
                },
                eventRender: function(info) {
                   info.event.title = "***";
                   console.log(info.event.title);
                },
                events: '/api/dates'
            });
            if ("{{LANG}}" == 'zh-hant') {
                calendar.setOption('locale', 'zh-tw');
            }
            calendar.render();
        });
</script>
<style>
    .fc-title{
        color:white;
    }
    #calendar{
        background-color: white;
        padding: 2rem;
    }
    .fc-content{
        font-size: 2rem;
    }
    .bigEvent{
        height:5rem;
        width:80%;
        margin-left: 10%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
{% endblock %}
