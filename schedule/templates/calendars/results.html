{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block title %}{% trans 'Result' %}{% endblock %}
{% block content %}
<script src="{% static "fullcalendar/resource-common/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-timegrid/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-timeline/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-daygrid/main.js" %}"></script>

<link rel="stylesheet" href="{% static 'fullcalendar/resource-timeline/main.min.css' %}">
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">
<div class="container">
    <div id="calendar">

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
    var Calendar = FullCalendar.Calendar;
    var Draggable = FullCalendarInteraction.Draggable;
    var calendarEl = document.getElementById('calendar');
    var initialLocaleCode = 'en';
    
    calendar = new FullCalendar.Calendar(calendarEl, {
      timeZone: 'UTC',
      editable: true,
      schedulerLicenseKey: '0780359527-fcs-1573633868',
      plugins: ['interaction', 'resourceTimeline'],
      header: {
        left: 'prev,next',
        center: 'title',
        right: "resourceTimelineMonth"
        // right: 'resourceTimelineMonth'
      },
      columnHeaderFormat: {
        weekday: 'short',
      },
      customButtons: {
      },
      aspectRatio: 1.5,
      resourceAreaWidth: "6rem",
      defaultView: 'resourceTimelineWeek',
      slotLabelInterval:{day:1},
      slotLabelFormat: [
          {weekday: 'short', month:'numeric', day:'numeric'},
      ],
      resourceLabelText: '員工列表',
      
    });
    if("{{LANG}}" == 'zh-hant'){
        calendar.setOption('locale','zh-tw');
    }
    calendar.render();
    });
</script>
<style>
    .container{
        max-width: 90vw;
    }
</style>
{% endblock %}
