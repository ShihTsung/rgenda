          return res.json();
        }).then(data=>{
          this.userData = data;
        }).catch(err=>{
          console.log(err);
        });

        
        fetch("http://localhost/api/results/")
        .then((res)=>{
          return res.json();
        }).then((data)=>{
          this.shiftData = data;
        }).catch((err)=>{
          console.log(err);
        });

    methods : {
      getYear(y,m) {
        let tmp = y % 4;
        if (tmp == 0) {
          return this.month_leap[m];
        } else {
          return this.month_normal[m];
        }
      },
      toWeekofDay(wday) {
        let weekofday = new Date(this.month + " " + wday + "," + this.year);
        return this.weekday[weekofday.getDay()];
      },
      ShiftOfUser(name, m) {
        return this.shiftData.filter((userItem)=>{
          if(userItem.user.full_name == name){
            return parseInt(userItem.date.split('-')[1]) == m;
          }
        });
