{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block title %}{% trans 'Result' %}{% endblock %}
{% block content %}
<script src="{% static "fullcalendar/resource-common/main.min.js" %}"></script>
<!-- <script src="{% static "fullcalendar/resource-timegrid/main.js" %}"></script> -->
<script src="{% static "fullcalendar/resource-timeline/main.min.js" %}"></script>
<script src="{% static "fullcalendar/resource-daygrid/main.min.js" %}"></script>

<link rel="stylesheet" href="{% static 'fullcalendar/resource-timeline/main.min.css' %}">
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<div class="container">
    <div id="calendar">

    </div>
</div>
<!-- modal  create-->
<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">new event</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form action="" id="addEvent">
          <label for="shift">{%trans 'Shift'%}</label>
          <select name="shift" id="shift" class="form-control">

          </select>
          <label for="station">{%trans 'Station'%}</label>
          <select name="station" id="station" class="form-control">

          </select>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">{%trans 'Cancel'%}</button>
        <button type="button" class="btn btn-primary" id="save">{%trans 'Save'%}</button>
      </div>
    </div>
  </div>
</div>


<!-- modal edit-->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">edit event</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form action="">
          <label for="shift">{%trans 'Shift'%}</label>
          <select name="shift" id="edit-shift" class="form-control">

          </select>
          <label for="station">{%trans 'Station'%}</label>
          <select name="station" id="edit-station" class="form-control">

          </select>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-dismiss="modal" id="edit-delete">{%trans 'Delete'%}</button>
        <button type="button" class="btn btn-primary" id="edit-save">{%trans 'Save'%}</button>
      </div>
    </div>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
    $('[data-toggle="tooltip"]').tooltip({html:true});
    var Calendar = FullCalendar.Calendar;
    var Draggable = FullCalendarInteraction.Draggable;
    var calendarEl = document.getElementById('calendar');
    var initialLocaleCode = 'en';
    let currInfo = {};
    let calendar;
    // 送出資料，新增事件
    let users = [];

    let sendData = function(){
      // 新 event
      let e = document.getElementById('shift')
      let title = e.options[e.selectedIndex].innerText
      let selectedId = e.options[e.selectedIndex].value
      e = document.getElementById('station')
      let station = e.options[e.selectedIndex].value
      let n = {
        user: currInfo.resource.id,
        shift: selectedId,
        station: station,
        date: currInfo.dateStr
      }
      fetch('/api/results/',
      {
        method: "POST",
        headers:{
          'X-CSRFToken': '{{ csrf_token }}',
          'content-type': 'application/json'
      },
        body: JSON.stringify(n)
      })
      .then(res=>{
        return res.json()
      })
      .then(e=>{
        calendar.refetchEvents();
      })

      $('#myModal').modal('hide');
    }
    save_btn = document.getElementById('save');
    save_btn.addEventListener('click', sendData);
    // 加入班別選項
    fetch('/api/shifts')
    .then(res=>{
      return res.json();
    })
    .then(data=>{
      data.forEach(e=>{
        option = document.createElement('option');
        option.text = e.name;
        option.value = e.id;
        document.getElementById('shift').add(option);
        option = document.createElement('option');
        option.text = e.name;
        option.value = e.id;
        document.getElementById('edit-shift').add(option);
      });
    });

    // 加入工作站選項
    fetch('/api/stations')
    .then(res=>{
      return res.json();
    })
    .then(data=>{
      data.forEach(e=>{
        option = document.createElement('option');
        option.text = e.name;
        option.value = e.id;
        document.getElementById('station').add(option);
        option = document.createElement('option');
        option.text = e.name;
        option.value = e.id;
        document.getElementById('edit-station').add(option);
      });
    });

    // fullcalendar 
    calendar = new FullCalendar.Calendar(calendarEl, {
      timeZone: 'UTC',
      editable: false,
      schedulerLicenseKey: '0780359527-fcs-1573633868',
      plugins: ['interaction', 'resourceTimeline'],
      header: {
        left: 'title',
        center: '',
        right: "custom2, prev, next, resourceTimelineWeek,resourceTimelineMonth"
      },
      columnHeaderFormat: {
        weekday: 'short',
      },
      aspectRatio: 2,
      resourceAreaWidth: "18rem",
      defaultView: 'resourceTimelineWeek',
      defaultDate:"{{start}}",
      validRange:{
        start:"{{start}}",
        end:"{{end}}"
      },
      slotLabelInterval:{day:1},
      slotLabelFormat: [
          {weekday: 'short', day:'numeric'},
      ], 
      resourceColumns: [
        {
          labelText: '員工',
          field: 'title'
        },
        {
          labelText: '排班',
          field: 'shift_num'
        },
        {
          labelText: '特休',
          field: 'special_rest'
        },
        {
          labelText: '加班',
          field: 'overtime'
        },
        {
          labelText: '差額',
          field: 'diff'
        }
      ],
      
      customButtons: {
      custom1: {
        text: 'save',
        click: function() {
          if (calendar.getOption('editable')==true){
            calendar.setOption('editable',false);
              calendar.setOption('header', {
                left: 'title',
                center: '',
                right: "custom2, prev, next, resourceTimelineWeek,resourceTimelineMonth"
              });
            }
          // window.location='/results'
          }
      },
      custom2: {
        text: 'edit',
        
       
        click: function() {
          if (calendar.getOption('editable')==false){
            calendar.setOption('editable', true);
              calendar.setOption('header', {
                left: 'title',
                center: '',
                right: "custom1, prev, next, resourceTimelineWeek,resourceTimelineMonth"
              });
            }
          }
        }
      },
      dateClick: function (info) {
        if(calendar.getOption('editable')){
          currInfo = info;
          $('#myModal').modal('show');
        }
      },
      eventClick:function(info){
        if(calendar.getOption('editable')){
          currInfo = info;
          $('#editModal').modal('show');
          let shift = document.getElementById('edit-shift')
          shift.value = info.event.extendedProps.shift.id;
        }
      },
      eventRender: function(info) {
        let prop = info.event.extendedProps;
        if((prop.shift.shift_type!=="休假")&&(prop.shift.shift_type!=="公假")&&(prop.shift.shift_type!=="例假")){
          $(info.el).tooltip({
            html:true, 
            title: "<h3 class='pop-up'>"+prop.station.name+'</h3>'+prop.shift.start_time+"~"+prop.shift.end_time,
          });
        }
        info.el.innerHTML = "";
        
        if(info.view.type === "resourceTimelineWeek"){
          info.el.classList.add("week");
          switch(prop.shift.shift_type){
            case "白班":
              info.el.classList.add("day-shift");
      
              info.el.innerHTML += "<h5 class='shift-title'>D</h5>"
              + "<div class='day-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>"
              + "<div class='day-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              
              break;
            case "小夜":
              info.el.classList.add("night-shift");
              info.el.innerHTML += "<h5 class='shift-title'>E</h5>"
              + "<div class='night-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>"
              + "<div class='night-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            case "大夜":
              info.el.classList.add("graveyard-shift");
              info.el.innerHTML += "<h5 class='shift-title'>N</h5>"
              + "<div class='graveyard-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>"
              + "<div class='graveyard-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            case "休假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>休假日</h6>";
              break;
            case "例假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>例假日</h6>";
              break;
            case "公假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>公假日</h6>";
              break;
            case "onCall":
              info.el.classList.add("on-call");
              info.el.innerHTML += "<h6 class='on-call-title1'>On</h6>"
              + "<h6 class='on-call-title2'>Call</h6>"
              + "<div class='on-call-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>"
              + "<div class='on-call-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            default: 
              info.el.classList.add("error");
              info.el.innerHTML += "<h6>ERROR</h6>";
              break;
          };
        }else{
          info.el.classList.add("month");
          switch(prop.shift.shift_type){
            case "白班":
              info.el.classList.add("day-shift");
              info.el.innerHTML += "<h5 class='shift-title' style='margin-top: 3px;'>D</h5>"
              + "<div class='day-station' style='margin-top: 3px;'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            case "小夜":
              info.el.classList.add("night-shift");
              info.el.innerHTML += "<h5 class='shift-title' style='margin-top: 3px;'>E</h5>"
              + "<div class='night-station' style='margin-top: 3px;'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            case "大夜":
              info.el.classList.add("graveyard-shift");
              info.el.innerHTML += "<h5 class='shift-title' style='margin-top: 3px;'>N</h5>"
              + "<div class='graveyard-station' style='margin-top: 3px;'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
              break;
            case "休假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>休假日</h6>";
              break;
            case "例假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>例假日</h6>";
              break;
            case "公假":
              info.el.classList.add("rest");
              info.el.innerHTML += "<h6 class='rest-title'>公假日</h6>";
              break;
            case "onCall":
              info.el.classList.add("on-call");
              info.el.innerHTML += "<h6 class='on-call-title-m'>OnCall</h6>";
              break;
            default: 
              info.el.innerHTML += "<h6 class='error-title'>ERROR</h6>";
              break;
          };
        }
        
      },
      eventDestroy:function(info){
        $(info.el).tooltip('dispose');
      },
      eventDrop: function(info){
        let update_body = {
          id: info.event.id,
          date: info.event.start.toISOString().split('T')[0],
          shift: info.oldEvent.extendedProps.shift.id,
        }
        if(info.newResource){
          update_body.user = info.newResource.id
        }
        fetch('/api/results/'+info.event.id+'/',
              {
              method: "PATCH",
              headers:{
                'X-CSRFToken': '{{ csrf_token }}',
                'content-type': 'application/json'
              },
              body: JSON.stringify(update_body)
            })
        .then(res=>{
          return res.json();
        })
        .then(json=>{
          console.log(json)
        })
      },
      // resourceLabelText: '員工列表',
      resources: function(fetchInfo, successCallback, failureCallback) {
        fetch('/api/users/?mode=resource')
        .then(res=>{
          return res.json();
        })
        .then(data=>{
          data.forEach(e=>{
            e.title = e.full_name;
            e.shift_num = e.shift_num.toString();
            e.special_rest = e.special_rest.toString();
            e.overtime = e.overtime.toString();
            e.diff = e.diff.toString();
          });
          successCallback(data);
        });
      },
      events: function(fetchInfo, successCallback, failureCallback){
        let url = '/api/results/?start='
        url += fetchInfo.startStr + '&end=' + fetchInfo.endStr
        fetch(url)
        .then(res=>{
          return res.json();
        })
        .then(data=>{
          data.forEach(e=>{
            e.title = e.shift.name;
            e.resourceId = e.user.id;
          });
          successCallback(data);
        });
      },
    });
    if("{{LANG}}" == 'zh-hant'){
        calendar.setOption('locale', 'zh-tw');
    }
    calendar.render();
    document.getElementById('edit-delete').addEventListener('click', 
      function(){
        let target = currInfo.event.id
        fetch('/api/results/'+target,
        {
        method: "DELETE",
        headers:{
          'X-CSRFToken': '{{ csrf_token }}',
          'content-type': 'application/json'
        }
      })
      .then(res=>{
        currInfo.event.remove();
      });
      });
    document.getElementById('edit-save').addEventListener('click', 
      function(){
        let e = document.getElementById('edit-shift');
        currInfo.event.setProp("title", e.options[e.selectedIndex].innerText);
        currInfo.event.setExtendedProp("shift", e.options[e.selectedIndex].value);
        e = document.getElementById('edit-station');
        currInfo.event.setExtendedProp("station", e.options[e.selectedIndex].value);
        console.log(currInfo.event)
        $('#editModal').modal('hide');
        let update_body = {
          id: currInfo.event.id,
          date: currInfo.event.start.toISOString().split('T')[0],
          shift: currInfo.event.extendedProps.shift,
          station: (currInfo.event.extendedProps.station ||null)
        }
        fetch('/api/results/'+currInfo.event.id+'/',
              {
              method: "PATCH",
              headers:{
                'X-CSRFToken': '{{ csrf_token }}',
                'content-type': 'application/json'
              },
              body: JSON.stringify(update_body)
            })
        .then(res=>{
          return res.json();
        })
        .then(json=>{
          console.log(json);
        })
      });
    });

</script>
<style>
  .pop-up{
    width: 100%;
    height: 10%;
    font-size: 17px;
    text-align: center;
  }
    #calendar{
      border-radius: 0%;
    }
    .container{
        max-width: 90vw;
    }
    .fc-custom1-button, .fc-custom2-button{
        width: 5rem;
    }
    .tooltip-head{
      background-color: black;
    }
    .week{
      margin: 10px 0px 0px 2px;
      border-radius: 3px;
      border: none;
      height: 35px;
    }
    .month{
      margin-top: 10px;
      border-radius: 3px;
      border: none;
      height: 30px;
    }
    .shift-title{
      color: white;
      margin-top: 6px;
    }
    .day-shift{
      background: #EBC57C;
    }
    .day-station{
      color: #EBC57C;
      width: 35px;
      height: 24px;
      background: white;
      border-radius: 3px;
      font-size: 8px;
      margin-top: 5px;
      margin-left: 2px;
      text-align: center;
      line-height: 24px;
    }
    .night-shift{
      background: #84B1ED;
    }
    .night-station{
      color: #84B1ED;
      width: 38px;
      height: 24px;
      background: white;
      border-radius: 3px;
      font-size: 8px;
      margin-top: 5px;
      margin-left: 2px;
      text-align: center;
      line-height: 24px;
    }
    .graveyard-shift{
      background: #6B799E;
    }
    .graveyard-station{
      color: #6B799E;
      width: 41px;
      height: 24px;
      background: white;
      border-radius: 3px;
      font-size: 8px;
      margin-top: 5px;
      margin-left: 2px;
      text-align: center;
      line-height: 24px;
    }
    .rest{
      background: white;
      border: 1px solid #e9e9e9;
      margin-left: 2px;
    }
    .rest-title{
      color: #bfbfbf;
      font-weight: 300;
      
    }
    .on-call{
      background: #9C8F96;
      
    }
    .on-call-title-m{
      color: white;
      font-weight: 300;
    }
    .on-call-title1{
      color: white;
      margin-top: 3px;
      font-size: 3px !important;
      position: absolute;
    }
    .on-call-title2{
      color: white;
      margin-top: 18px;
      font-size: 3px !important;
    }
    .on-call-station{
      float: left;
      background: white;
      color: #9C8F96;
      width: 33px;
      height: 20px;
      border-radius: 3px;
      margin-left: 1px;
      margin-top: 6px;
      font-size: 9px;
      line-height: 20px;
      text-align: center;
    }
    .error{
      background: red;
    }
    .error-title{
      color: white;
    }
</style>
{% endblock %}
