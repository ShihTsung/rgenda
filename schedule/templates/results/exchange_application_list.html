{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}exchange application{% endblock %}

{% block content %}
<div class="container">

    <!-- {{processing}}
    {{complete}} -->
    <!-- <form action="">
        {{form|crispy}}
    </form> -->
    <h3>調班申請</h3>
    <hr/>
    <div class="ex-wrapper">
        <label for="exchange_calendar">調班日期</label>
        <input id="exchange_calendar" type="date">
    </div>
    <div class="ex-wrapper">
        <label for="origin_schedule">原排班別</label>
        <div id="origin_schedule">
            <h4 class="os_title">D</h4>
            <div class="os_content" style="width: 40px; padding-left: 4px;">
                7a-4p
            </div>
            <div class="os_content">
                工作站1
            </div>
        </div>
    </div>
    <div class="ex-wrapper">
        <label for="exchange_shift">欲換班別</label>
        <div id="exchange_shift">
            <ul class="dropdown_menu" style="visibility: hidden;">
                <li id="day_shift">日班</li>
                <li id="night_shift">小夜班</li>
                <li id="graveyard_shift">晚班</li>
                <li>休假日</li>
            </ul>
            <div class="down-arrow">
                <svg fill="#525aa8" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path d="M0 7.33l2.829-2.83 9.175 9.339 9.167-9.339 2.829 2.83-11.996 12.17z"/></svg>
            </div>
        </div>
    </div>
    <div class="ex-wrapper">
        <label for="exchange_staff">換班人員</label>
        <div id="exchange_staff">
            <ul class="dropdown_menu_staff" style="visibility: hidden;">
                <li id="flower">阿花</li>
                <li id="red">小朱</li>
                <li id="yellow">大黃</li>
            </ul>
            <div class="down-arrow-staff">
                <svg fill="#525aa8" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path d="M0 7.33l2.829-2.83 9.175 9.339 9.167-9.339 2.829 2.83-11.996 12.17z"/></svg>
            </div>
        </div>
    </div>
    <div class="ex-wrapper">
        <label for="exchange_back_date">提供換回日期</label>
        <div id="exchange_back_date">
            <input type="radio" name="back_date" checked="checked"/>提供
            <input type="radio" name="back_date"/>不提供
        </div>
    </div>
    <div class="btn-style">
        <button style="width: 90px; height: 45px; background: #38449a; border-radius: 3px; border: 1px solid #38449a; color: white;">送出</button>
        <button style="width: 90px; height: 45px; background: #38449a; border-radius: 3px; border: 1px solid #38449a; color: white;">取消</button>
    </div>
    
</div>

{% endblock %}
{% block styles %}
<style>
    label{
        margin-left: 15px;
        float: left;
    }
    hr{
        border: 1px solid #e2e2e2;
        margin-bottom: 30px;
    }
    .ex-wrapper{
        margin-top: 20px;
        height: 28px;
    }
    #exchange_calendar{
        width: 200px;
        border: 1px solid #e2e2e2;
        border-radius: 3px;
        color: #ababab;
        text-align: center;
        margin-left: 10px;
        margin-bottom: 0px;
    }
    #origin_schedule{
        display: inline-block;
        width: 135px;
        height: 24px;
        margin-left: 17px;
        background: #EBC57C;
        border-radius: 3px;
    }
    .os_title{
        display: inline-block;
        color: white;
        margin-left: 5px;
        font-weight: 400;
        float: left;
        margin-top: -2px;
    }
    .os_content{
        display: inline-block;
        background: white;
        height: 20px;
        width: 45px;
        color: #EBC57C;
        border-radius: 3px;
        float: left;
        margin-left: 5px;
        margin-top: 2px;
        font-size: 12px;
        line-height: 20px;
        padding-left: 2px;
    }
    #exchange_shift{
        margin-left: 90px;
        border: 1px solid #e2e2e2;
        border-radius: 3px;
        width: 200px;
        height: 28px;
        color: #ababab;
        text-align: center;
        background-color: white;
        
    }
    .dropdown_menu{
        list-style: none;
        position: absolute;
        left: 105px;
        top: 315px;
        border: 1px solid #e1e1e1;
        border-radius: 3px;
        width: 200px;
        text-align: center;
        background: white;
        padding-left: 0px;

    }
    .dropdown_menu li{
        height: 24px;
        width: 200px;
        border-bottom: 1px solid #e1e1e1;
    }
    .dropdown_menu li:hover{
        background: #6871b3cc;
        color: white;
        cursor: pointer;
    }
    .down-arrow{
        float: right;
        margin-right: 5px;
        cursor: pointer;
        height: 28px;
        width: 30px;
    }
    svg{
        pointer-events: none;
    }
    #exchange_staff{
        margin-left: 90px;
        border: 1px solid #e2e2e2;
        border-radius: 3px;
        width: 200px;
        height: 28px;
        color: #ababab;
        text-align: center;
        background-color: white;
    }
    .dropdown_menu_staff{
        list-style: none;
        position: absolute;
        left: 105px;
        top: 363px;
        border: 1px solid #e1e1e1;
        border-radius: 3px;
        width: 200px;
        text-align: center;
        background: white;
        padding-left: 0px;
    }
    .dropdown_menu_staff li{
        height: 24px;
        width: 200px;
        border-bottom: 1px solid #e1e1e1;
    }
    .dropdown_menu_staff li:hover{
        background: #6871b3cc;
        color: white;
        cursor: pointer;
    }
    .down-arrow-staff{
        float: right;
        margin-right: 5px;
        cursor: pointer;
        height: 28px;
        width: 30px;
    }
    #exchange_back_date{
        margin-left: 90px;
        width: 200px;
        height: 28px;
        text-align: center;
    }
    input{
        cursor: pointer;
    }
    .btn-style{
        width: 200px;
        height: 50px;
        margin-top: 50px;
        margin-left: 30px;
    }
</style>
{% endblock %}
