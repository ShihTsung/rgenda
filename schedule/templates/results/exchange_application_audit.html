{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% block title %}部門調班審核{% endblock %}

{% block content %}
<div id="app" class="container-fluid">
    <!-- {{processing}}
    {{complete}}
    {{form}} -->
    <h3>調班審核</h3>
    <hr/>
    <application-audit csrf-token="{{ csrf_token }}"></application-audit>
    <hr/>
    <div id="calendar"></div>
</div>

<script src="{% static 'assets/application-audit.bundle.js' %}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        let Calendar = FullCalendar.Calendar;
        let Draggable = FullCalendarInteraction.Draggable;
        let calendarEl = document.getElementById('calendar');
        let initialLocaleCode = 'en';


        calendar = new FullCalendar.Calendar(calendarEl, {
                plugins: ['interaction', 'dayGrid'],
                selectable: false,
                selectHelper: true,
                theme: true,
                editable: true,
                themeSystem: 'bootstrap',
                weekMode: 'liquid',
                eventLimit: true, // when too many events in a day, show the popover
                timeZone: 'UTC',
                header: {
                    left: '',
                    center: 'prev,title,next',
                    right: ''
                },
                contentHeight: 450,
                showNonCurrentDates: false,
                droppable: true,
                views: {
                    dayGridMonth: {
                        titleFormat: { year: 'numeric', month: '2-digit' }
                    }
                },
                eventClick: function(info){
                    currInfo = info;
                    $('#exampleModalLabel').text(info.event.start.toISOString().split('T')[0]);
                    $('#myModal').modal('show');
                    $('#day').val(info.event.title);
                    $('#locked').prop('checked',info.event.extendedProps.locked);
                },
                eventRender: function(info) {
                    let prop = info.event.extendedProps;
                    info.event.title = info.event.extendedProps.shift.name;
                    if (info.event.extendedProps.locked){
                        x = document.createElement('div');
                        x.innerHTML = '<i class="fas fa-lock" margin-left:5px;font-size:1rem;"></i>';
                        info.el.appendChild(x);
                        console.log(info);
                    }
                    // console.log(info.event.extendedProps.shift.shift_type);
                    info.el.innerHTML = "";
                    info.el.classList.add("shift");

                    switch(prop.shift.shift_type){
                        case "白班":
                            info.el.classList.add("day-shift");
                            info.el.innerHTML += "<h5 class='shift-title'>D</h5>"
                            + "<div class='day-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>";
                            if(prop.station.name.split('')[2] == 'R'){
                                let station = prop.station.name.split('')[0] + prop.station.name.split('')[1] + prop.station.name.split('')[2];
                                info.el.innerHTML +=  "<div class='day-station'>" + station + "</div>";
                            }else{
                                info.el.innerHTML += "<div class='day-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
                            };
                            break;
                        case "小夜":
                            info.el.classList.add("night-shift");
                            info.el.innerHTML += "<h5 class='shift-title'>E</h5>"
                            + "<div class='night-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>";
                            if(prop.station.name.split('')[2] == 'R'){
                                let station = prop.station.name.split('')[0] + prop.station.name.split('')[1] + prop.station.name.split('')[2];
                                info.el.innerHTML +=  "<div class='night-station'>" + station + "</div>";
                            }else{
                                info.el.innerHTML += "<div class='night-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
                            };
                            break;
                        case "大夜":
                            info.el.classList.add("graveyard-shift");
                            info.el.innerHTML += "<h5 class='shift-title'>N</h5>"
                            + "<div class='graveyard-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>";
                            if(prop.station.name.split('')[2] == 'R'){
                                let station = prop.station.name.split('')[0] + prop.station.name.split('')[1] + prop.station.name.split('')[2];
                                info.el.innerHTML +=  "<div class='graveyard-station'>" + station + "</div>";
                            }else{
                                info.el.innerHTML += "<div class='graveyard-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";
                            }
                            break;
                        case "休假":
                            info.el.classList.add("rest");
                            info.el.innerHTML += "<h6 class='rest-title'>休假日</h6>";
                            break;
                        case "例假":
                            info.el.classList.add("rest");
                            info.el.innerHTML += "<h6 class='rest-title'>例假日</h6>";
                            break;
                        case "公假":
                            info.el.classList.add("rest");
                            info.el.innerHTML += "<h6 class='rest-title'>公假日</h6>";
                            break;
                        case "onCall":
                            info.el.classList.add("on-call");
                            info.el.innerHTML += "<h6 class='on-call-title'>OnCall</h6>"
                            + "<div class='on-call-station'>" + prop.shift.start_time.split(':')[0] + "-" + prop.shift.end_time.split(':')[0] + "</div>"
                            + "<div class='on-call-station'>" + prop.station.name.split('')[0] + prop.station.name.split('')[1] + "</div>";

                            break;
                        default:
                            info.el.innerHTML += "<h6>ERROR</h6>";
                            break;
                    };
                },
                events: function(fetchInfo, successCallback, failureCallback){
                    let url = '/api/results/?mode=personal&start='
                    url += fetchInfo.startStr + '&end=' + fetchInfo.endStr
                    fetch(url)
                    .then(res=>{
                    return res.json();
                    })
                    .then(data=>{
                    data.forEach(e=>{
                        e.title = e.shift.name;
                        e.resourceId = e.user.id;
                        e.color = '#EBC57C'
                    });
                    successCallback(data);
                    });
                },
            });
            if ("{{LANG}}" == 'zh-hant') {
                calendar.setOption('locale', 'zh-tw');
            }
            calendar.render();

        });
</script>
{% endblock %}
