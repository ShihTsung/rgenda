{% extends "base.html" %}
{% block title %} accounts {% endblock %}
{% load i18n %}
{% load static %}

{% block content %}
<div id="app" class="container">
    <!-- modal -->
    <div class="modal fade" id="modal-delete" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title" id="exampleModalScrollableTitle">刪除科別</h3>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Do you confirm to delete?</p>
                    <div class="row">
                        <div class="col text-right"><button class="btn btn-primary" type="button" data-dismiss="modal">取消</button></div>
                        <div class="col text-left"><button id="btn-delete" class="btn btn-danger" type="button">刪除</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End modal -->

    <div class="title text-left">
        <h1>科別管理</h1>
    </div>

    {% for message in messages %}
    <div class="alert {{ message.tags }} alert-dismissible" role="alert">
        {{message}}
    </div>
    {% endfor %}

    <div class="row">
      <div class="col-sm-12">
        <a href="/departments/create" class="icon-bts float-right" data-tooltip="tooltip" title="新增班別">
          <i class="fa fa-plus-square icon-color"></i>
        </a>
      </div>
    </div>

    <department-list role="{{user.role}}" csrf-token="{{ csrf_token }}"></department-list>
</div>


<style scoped>
  table {
    background-color: white;
    box-shadow: 1px 1px 3px 0px rgba(0, 0, 0, 0.8);
  }

  #myInput:focus {
    outline: none;
  }

  .create-btn {
    width: 100%;
  }
</style>

{% block head %}
<link rel="stylesheet" href="{% static 'css/searchbar.css' %}">
{% endblock %}

<script src="{% static 'assets/department-list.bundle.js' %}"></script>

{% endblock %}
