{% extends "base.html" %}
{% block title %} Edit Department {% endblock %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="title text-center">
                    <h2>Edit Department</h2>
                </div>
                {% csrf_token %}

                {{ form.name |as_crispy_field }}
                {{ form.detail |as_crispy_field }}
                <div class="form-group">
                    <label for="">manager1</label>
                    <select name="mgr1" id="manager1" class="form-control">
                        <option value="NULL" selected="selected">---</option> 
                    </select>
                </div>
                <div class="form-group">
                    <label for="">manager2</label>
                    <select name="mgr2" id="manager2" class="form-control">
                        <option value="NULL" selected="selected">---</option> 
                    </select>
                </div>

                <div class="col-12 text-center">
                    <button class='btn-secondary btn-lg col-md-3' id="back">Back</button>
                    <button class='btn-primary btn-lg col-md-3' type="submit">update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('back').addEventListener('click', function(){
        window.location.href="/departments/list";
    });
    document.addEventListener('DOMContentLoaded', function(){
        let department = "{{id}}";
        let users = [];
        let mgr1 = document.getElementById('manager1');
        let mgr2 = document.getElementById('manager2');
        let selected = []
        fetch('/api/users/?department=' + department)
        .then(res=>{
            return res.json()
        })
        .then(data=>{
            //過濾出要顯示在選單的人
            let index = 1
            data.forEach(e=>{
                if(e.role!=='admin'){
                    op = document.createElement('option')
                    op.value = e.id;
                    op.text = e.full_name;
                    mgr1.appendChild(op);
                    op = document.createElement('option')
                    op.value = e.id;
                    op.text = e.full_name;
                    mgr2.appendChild(op);
                    if (e.role=='manager' && !selected.includes(index)){
                        selected.push(index)
                    }
                    index ++;
                    
                }
            });
            mgr1.selectedIndex = selected[0];
            mgr2.selectedIndex = selected[1];
        });
        
    });
</script>
<style>
    .card{
        margin-top:5rem;
        box-shadow: 1px 1px 2px 0px;
        min-width: 20rem;
    }
    .card-body{
        padding: 5rem 10rem;
    }
</style>
{% endblock %}
