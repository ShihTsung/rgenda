{% extends "base.html" %}
{% block title %} Edit Station {% endblock %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="title text-center">
                    <h2>Edit Station</h2>
                </div>
                {% csrf_token %}
                
                {{form.name | as_crispy_field}}
                {{form.department | as_crispy_field}}
                    
            <div class="col-12 text-center">
                <a href="/stations/list" class="btn btn-secondary btn-lg col-3">Cancel</a>
                <button class='btn btn-primary btn-lg col-md-3' type="submit">update</button>
            </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card{
    margin-top:5rem;
    box-shadow: 1px 1px 2px 0px;
    min-width: 20rem;
    }
    .card-body{
        padding: 5rem 10rem;
    }
</style>
{% endblock %}
