{% extends "base.html" %}
{% block title %} 工作站管理 {% endblock %}
{% load i18n %}
{% load static %}
{% block content %}
<div id="app" class="container">
  <div class="title text-left">
    <h3>工作站管理</h3>
  </div>

  {% for message in messages %}
    <div class="alert {{ message.tags }} alert-dismissible" role="alert">
        {{message}}
    </div>
  {% endfor %}

  <station-list
  csrf-token="{{ csrf_token }}"
  :my-department-id="{{ user.department.id }}"></station-list>

</div>

{% block head %}
<script src="{% static 'assets/station-list.bundle.js' %}"></script>
{% endblock %}

{% endblock %}
