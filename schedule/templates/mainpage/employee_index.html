{% extends 'base.html' %}
{% load i18n %}

{% block title %}Redfalcon Schedule | Home{% endblock %}
{% load static %}
{% block content %}
<div class="container">
  <div class="greet text-center">
        <h1>使用者首頁</h1>
  </div>
        <div class="dash">
          <div class="card">
           <div class="card-header text-center"> 
             <button class="btn" id="toggle-btn">
               <i class="fa fa-bars"></i>
             </button>班表分析
           </div>
           <div class="card-body DashCollapse" >
             <div class="left">
               <div class='data'><div class="label">工作日</div><div class="nums">1</div></div>
               <div class='data'><div class="label">休息日</div><div class="nums">1</div></div>
               <div class='data'><div class="label">例假日</div><div class="nums">1</div></div>
               <div class='data'><div class="label">國定假日</div><div class="nums">1</div></div>
               <div class='data'><div class="label">特休</div><div class="nums">1</div></div>
             </div>
             <div class="right">
               <canvas  id='chart1'>
               </canvas>
             </div>
             
           </div>
   
           </div>
          
          <div class="card">
           <div class="card-header text-center">出勤分析</div>
           <div class="card-body DashCollapse" >
             <div class="left">
               <div class='data'><div class="label">排班</div><div class="nums">1</div></div>
               <div class='data'><div class="label">加班</div><div class="nums">1</div></div>
               <div class='data'><div class="label">On call</div><div class="nums">1</div></div>
               <div class='data'><div class="label">減班</div><div class="nums">1</div></div>
               <div class='data'><div class="label">差額</div><div class="nums">1</div></div>
             </div>
             <div class="right">
               <canvas  id='chart2'>
               </canvas>
             </div>
           </div>
          </div>
       </div>
           
          <div id="calendar"></div>
    
        

</div>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.bundle.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var initialLocaleCode = 'en';
    var localeSelectorEl = document.getElementById('locale-selector');
    var Draggable = FullCalendarInteraction.Draggable;
    var calendarEl = document.getElementById('calendar');
    var nextPeriod = {}
    let btn = document.getElementById('toggle-btn')
    btn.addEventListener('click', function(){
    let contents = document.querySelectorAll('.DashCollapse');
    contents.forEach(e=>{
      e.classList.toggle('collapse')
      });
    });

  // 第一個圖
  var ctx = document.getElementById('chart1').getContext('2d');
  var myChart = new Chart(ctx, {
    type: 'horizontalBar',
    data: {
        labels: ['白班', '小夜', '大夜', 'On call', '空班'],
        datasets: [{
            barThickness: 30,
            data: [12, 7, 5, 5, 2],
            backgroundColor: [
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
            ],
            borderColor: [
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                    offsetGridLines: false,
                    display: false
                }
            }],
            xAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                offsetGridLines: false,
              }
            }]
        },
        legend:{
          display: false,
        },
        aspectRatio: 1.6,
        maintainAspectRatio: false
    }
});


// 第二個圖
  var ctx = document.getElementById('chart2').getContext('2d');
    var myChart = new Chart(ctx, {
      type: 'horizontalBar',
      data: {
          labels: ['排班', '出勤', '公假', '自假'],
          datasets: [{
              barThickness: 30,
              data: [12, 7, 5, 5],
              backgroundColor: [
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
              ],
              borderColor: [
                '#37419A',
                '#37419A',
                '#37419A',
                '#37419A',
              ],
              borderWidth: 1
          }]
      },
      options: {
          scales: {
              yAxes: [{
                  ticks: {
                      beginAtZero: true
                  },
                  gridLines: {
                      offsetGridLines: false,
                      display: false
                  }
              }],
              xAxes: [{
                  ticks: {
                      beginAtZero: true
                  },
                  gridLines: {
                  offsetGridLines: false,
                }
              }]
          },
          legend:{
            display: false,
          },
          aspectRatio: 1.6,
          maintainAspectRatio: false
      }
    });
    // fullcalendar
    calendar = new FullCalendar.Calendar(calendarEl, {
                plugins: ['interaction', 'dayGrid'],
                selectable: false,
                selectHelper: true,
                theme: true,
                editable: true,
                themeSystem: 'bootstrap',
                weekMode: 'liquid',
                eventLimit: true, // when too many events in a day, show the popover
                timeZone: 'UTC',
                header: {
                    left: '',
                    center: 'prev,title,next',
                    right: ''
                },
                contentHeight: 450,
                showNonCurrentDates: false,
                droppable: true,
                views: {
                    dayGridMonth: { 
                        titleFormat: { year: 'numeric', month: '2-digit' }
                    }
                },
                eventClick: function(info){
                    currInfo = info;
                    $('#exampleModalLabel').text(info.event.start.toISOString().split('T')[0]);
                    $('#myModal').modal('show');
                    $('#day').val(info.event.title);
                    $('#locked').prop('checked',info.event.extendedProps.locked);
                },
                eventRender: function(info) {
                    info.event.title = info.event.extendedProps.shift.name;
                    if (info.event.extendedProps.locked){
                        x = document.createElement('div');
                        x.innerHTML = '<i class="fas fa-lock" margin-left:5px;font-size:1rem;"></i>';
                        info.el.appendChild(x);
                        console.log(info);
                    }
                },
                events: function(fetchInfo, successCallback, failureCallback){
                    let url = '/api/results/?mode=personal&start='
                    url += fetchInfo.startStr + '&end=' + fetchInfo.endStr
                    fetch(url)
                    .then(res=>{
                    return res.json();
                    })
                    .then(data=>{
                    data.forEach(e=>{
                        e.title = e.shift.name;
                        e.resourceId = e.user.id;
                        e.color = '#EBC57C'
                    });
                    successCallback(data);
                    });
                },
            });
            if ("{{LANG}}" == 'zh-hant') {
                calendar.setOption('locale', 'zh-tw');
            }
            calendar.render();

  });
</script>
{% endblock %}
