{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block title %}Redfalcon Schedule | Home{% endblock %}
<!-- {% load static %} -->
{% block content %}
<script src="{% static "fullcalendar/resource-common/main.min.js" %}"></script>
<script src="{% static "fullcalendar/resource-timeline/main.min.js" %}"></script>
<script src="{% static "fullcalendar/resource-daygrid/main.min.js" %}"></script>

<link rel="stylesheet" href="{% static 'fullcalendar/resource-timeline/main.min.css' %}">
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">
<div class="container">
    <div class="dash">
       <div class="card">
        <div class="card-header text-center"> 
          <button class="btn" id="toggle-btn">
            <i class="fa fa-bars"></i>
          </button>班表分析
        </div>
        <div class="card-body DashCollapse" >
          <div class="left">
            <div class='data'><div class="label">工作日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">休息日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">例假日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">國定假日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">特休</div><div class="nums">1</div></div>
          </div>
          <div class="right">
            <canvas  id='chart1'>
            </canvas>
          </div>
          
        </div>

        </div>
       
       <div class="card">
        <div class="card-header text-center">出勤分析</div>
        <div class="card-body DashCollapse" >
          <div class="left">
            <div class='data'><div class="label">排班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">加班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">On call</div><div class="nums">1</div></div>
            <div class='data'><div class="label">減班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">差額</div><div class="nums">1</div></div>
          </div>
          <div class="right">
            <canvas  id='chart2'>
            </canvas>
          </div>
        </div>
       </div>
    </div>
     
    <div id="calendar"></div>
</div> <!-- end container -->
<!-- chart.js CDN -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.bundle.js">
</script>


<script>
  let btn = document.getElementById('toggle-btn')
  btn.addEventListener('click', function(){
  let contents = document.querySelectorAll('.DashCollapse');
  contents.forEach(e=>{
    e.classList.toggle('collapse')
    });
  });
  // 第一個圖
  var ctx = document.getElementById('chart1').getContext('2d');
  var myChart = new Chart(ctx, {
    type: 'horizontalBar',
    data: {
        labels: ['白班', '小夜', '大夜', 'On call', '空班'],
        datasets: [{
            barThickness: 30,
            data: [12, 7, 5, 5, 2],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                    offsetGridLines: false,
                    display: false
                }
            }],
            xAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                offsetGridLines: false,
              }
            }]
        },
        legend:{
          display: false,
        },
        aspectRatio: 1.6,
        maintainAspectRatio: false
    }
});


// 第二個圖
var ctx = document.getElementById('chart2').getContext('2d');
  var myChart = new Chart(ctx, {
    type: 'horizontalBar',
    data: {
        labels: ['排班', '出勤', '公假', '自假'],
        datasets: [{
            barThickness: 30,
            data: [12, 7, 5, 5],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                    offsetGridLines: false,
                    display: false
                }
            }],
            xAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                offsetGridLines: false,
              }
            }]
        },
        legend:{
          display: false,
        },
        aspectRatio: 1.6,
        maintainAspectRatio: false
    }
});

// calendar
    var Calendar = FullCalendar.Calendar;
    var calendarEl = document.getElementById('calendar');
    var initialLocaleCode = 'en';
    let currInfo = {};
    let calendar;
    let users = [];
    calendar = new FullCalendar.Calendar(calendarEl, {
      timeZone: 'UTC',
      editable: false,
      schedulerLicenseKey: '0780359527-fcs-1573633868',
      plugins: ['interaction', 'resourceTimeline'],
      height: 600,
      contentHeight: 600,
      header: {
        left: 'prev,next, custom2',
        center: 'title',
        right: "resourceTimelineWeek,resourceTimelineMonth"
      },
      columnHeaderFormat: {
        weekday: 'short',
      },
      aspectRatio: 2,
      expandRows:true,
      visibleRange:{
        start:"{{start}}",
        end: "{{end}}"
      },
      validRange: {
        start: "{{start}}",
        end: "{{end}}"
      },
      resourceAreaWidth: "15rem",
      defaultView: 'resourceTimelineWeek',
      defaultDate: "{{default}}",
      slotLabelInterval:{day:1},
      slotLabelFormat: [
          {weekday: 'short', day:'numeric'},
      ],
      resourceLabelText: '員工列表',
      resources: function(fetchInfo, successCallback, failureCallback) {
        fetch('/api/stations/?mode=resource/')
        .then(res=>{
          return res.json();
        })
        .then(data=>{
          data.forEach(e=>{
            e.title = e.name
          });
          successCallback(data);
        });
      },
      eventRender: function(info) {
        let prop = info.event.extendedProps
        $(info.el).tooltip({
          html:true, 
          title: '<h3>'+prop.station.name+'</h3>'+prop.shift.start_time+"~"+prop.shift.end_time,
        });
      },
      eventDestroy:function(info){
        $(info.el).tooltip('dispose');
      },
      events: function(fetchInfo, successCallback, failureCallback){
        let url = '/api/{{results}}/?start='
        url += fetchInfo.startStr + '&end=' + fetchInfo.endStr
        fetch(url)
        .then(res=>{
          return res.json();
        })
        .then(data=>{
          data.forEach(e=>{
            e.title = e.user.full_name;
            if(!e.station){
              delete e
            }
            e.resourceId = e.station.id;
            if (e.shift.shift_type == '休假'){
              e.color = 'red';
            }
          });
          successCallback(data);
        });
      }
    });
    if("{{LANG}}" == 'zh-hant'){
        calendar.setOption('locale', 'zh-tw');
    }
    calendar.render();
    
    

</script>
{% endblock %}

{% block styles %}
<style>

    .container {
        /* background-color:green; */
        padding: auto;
    }

  
    a, a:hover{
        text-decoration: none;
    }
    #calendar{
        width: 100%;
        overflow: hidden;
        
    }

    .dash{
    width: 100%;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    flex-wrap: nowrap;
    margin-bottom: 2rem;
    }

    .DashCollapse{
      height: 20rem;
      display:inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
    }

    .card{
      width: 48%;
    }
    .card-header{
      font-size: 1.6rem;
    }

    .card-header>.btn{
      margin: 0;
      float:left;
    }

    .calendar{
    width: 100%;
    height: 50%;
    }
    
    .content{
    width: 100%;

</style>
{% endblock %}
