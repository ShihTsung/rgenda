{% extends 'base.html' %}
{% load i18n %}

{% block title %}Redfalcon Schedule | Home{% endblock %}
<!-- {% load static %} -->
{% block content %}
<script src="{% static "fullcalendar/resource-common/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-timegrid/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-timeline/main.js" %}"></script>
<script src="{% static "fullcalendar/resource-daygrid/main.js" %}"></script>

<div class="container">

    <div class="dash-top" >
        資訊面板
        {{LANG}}
    </div>
    <div id="calendar">
        班表
    </div>
</div> <!-- end container -->


{% endblock %}

{% block styles %}
<style>
    .dash-top{
        width: 100%;
        margin-bottom: 3rem;
        height: 8rem;
        background-color: chocolate;
    }
   
    .greet {
        margin-top: 2rem;
        height: 8rem;
        display: flex;
        flex-direction: column;
        /* background-color:palegoldenrod; */
    }

    .greet{
        align-content: center;
    }

    .container {
        /* background-color:green; */
        padding: auto;
        height: 100vh;
    }

    .row {
        display: flex;
        width: 100%;
        margin: auto;
        margin-top: 1rem;
        flex-direction: row;
        /* background-color: brown; */
    }
    /* #calendar{
        background-color: white!important;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0px 0px 3px 0px;
    } */
    a, a:hover{
        text-decoration: none;
    }

    .modal{
        top: 0;
        left: 20vw;
    }
    .modal-content{
        width: 60vw;
        /* left: 25%; */
    }
    .modal-body{
        max-width: 60vw;
    }
  
</style>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        timeZone: 'UTC',
        editable: true,
        schedulerLicenseKey: '0780359527-fcs-1573633868',
        plugins: [ 'interaction', 'resourceTimeline' ],
        header: {
        left: 'promptResource today prev,next',
        center: 'title',
        right: 'resourceTimelineDay,resourceTimelineWeek'
        },
        resourceAreaWidth: "6rem",
        customButtons: {
        promptResource: {
            text: '+ room',
            click: function() {
            var title = prompt('Room name');
            if (title) {
                calendar.addResource({
                title: title
                });
            }
            }
        }
        },
        // editable: true,
        aspectRatio: 2,
        defaultView: 'resourceTimelineWeek',
        slotLabelInterval:{day:1},
        slotLabelFormat: [
          {month:'numeric', day:'numeric', weekday: 'short'},// lower level of text
        ],
        resourceLabelText: 'Rooms',
        resources: 'https://fullcalendar.io/demo-resources.json?with-nesting',
        events: 'https://fullcalendar.io/demo-events.json?single-day&for-resource-timeline'
    });
    if ("{{LANG}}" == 'zh-hant') {
      calendar.setOption('locale', 'zh-tw');
    }
    calendar.render();
    });
  </script>
{% endblock %}
{% block heads%}
<link rel="stylesheet" href="{% static 'fullcalendar/resource-timeline/main.min.css' %}">
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">
{% endblock %}
