{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block title %}Redfalcon Schedule | Home{% endblock %}
<!-- {% load static %} -->
{% block content %}
<div class="container">
    <div class="dash">
       <div class="card">
        <div class="card-header text-center"> 
          <button class="btn" id="toggle-btn">
            <i class="fas fa-bars"></i>
          </button>班表分析
        </div>
        <div class="card-body DashCollapse" >
          <div class="left">
            <div class='data'><div class="label">工作日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">休息日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">例假日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">國定假日</div><div class="nums">1</div></div>
            <div class='data'><div class="label">特休</div><div class="nums">1</div></div>
          </div>
          <div class="right">
            <canvas  id='chart1'>
            </canvas>
          </div>
          
        </div>

        </div>
       
       <div class="card">
        <div class="card-header text-center">出勤分析</div>
        <div class="card-body DashCollapse" >
          <div class="left">
            <div class='data'><div class="label">排班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">加班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">On call</div><div class="nums">1</div></div>
            <div class='data'><div class="label">減班</div><div class="nums">1</div></div>
            <div class='data'><div class="label">差額</div><div class="nums">1</div></div>
          </div>
          <div class="right">
            <canvas  id='chart2'>
            </canvas>
          </div>
        </div>
       </div>
    </div>
     
    {% include 'total_calendar.html' %}
</div> <!-- end container -->
<!-- chart.js CDN -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.bundle.js">
</script>


<script>
  let btn = document.getElementById('toggle-btn')
  btn.addEventListener('click', function(){
  let contents = document.querySelectorAll('.DashCollapse');
  contents.forEach(e=>{
    e.classList.toggle('collapse')
    });
  });
  // 第一個圖
  var ctx = document.getElementById('chart1').getContext('2d');
  var myChart = new Chart(ctx, {
    type: 'horizontalBar',
    data: {
        labels: ['白班', '小夜', '大夜', 'On call', '空班'],
        datasets: [{
            barThickness: 30,
            data: [12, 7, 5, 5, 2],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                    offsetGridLines: false,
                    display: false
                }
            }],
            xAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                offsetGridLines: false,
              }
            }]
        },
        legend:{
          display: false,
        },
        aspectRatio: 1.6,
        maintainAspectRatio: false
    }
});


// 第二個圖
var ctx = document.getElementById('chart2').getContext('2d');
  var myChart = new Chart(ctx, {
    type: 'horizontalBar',
    data: {
        labels: ['排班', '出勤', '公假', '自假'],
        datasets: [{
            barThickness: 30,
            data: [12, 7, 5, 5],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                    offsetGridLines: false,
                    display: false
                }
            }],
            xAxes: [{
                ticks: {
                    beginAtZero: true
                },
                gridLines: {
                offsetGridLines: false,
              }
            }]
        },
        legend:{
          display: false,
        },
        aspectRatio: 1.6,
        maintainAspectRatio: false
    }
});


</script>
{% endblock %}

{% block styles %}
<style>

    .container {
        /* background-color:green; */
        padding: auto;
    }

  
    a, a:hover{
        text-decoration: none;
    }
    #calendar{
        width: 100%;
        overflow: hidden;
        
    }

    .dash{
    width: 100%;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    flex-wrap: nowrap;
    margin-bottom: 2rem;
    }

    .DashCollapse{
      height: 20rem;
      display:inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
    }

    .card{
      width: 48%;
    }
    .card-header{
      font-size: 1.6rem;
    }

    .card-header>.btn{
      margin: 0;
      float:left;
    }

    .calendar{
    width: 100%;
    height: 50%;
    }
    
    .content{
    width: 100%;
    height: 30rem;
    display: flex;
    justify-content: space-around;
    }
    
    .right{
      width: 65%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      display:inline-flex;
      max-width: 25rem;
      position: relative;
    }

    .left{
      width: 30%;
      height: 100%;
      min-width: 10rem;
      margin: 0;
      display: inline-flex;
      flex-direction: column;
      justify-content: space-around;
      font-size: 1rem;
    }
    .data{
      display: flex;
    }
    .label{
      width: 60%;
    }
</style>
{% endblock %}
