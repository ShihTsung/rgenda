{% block styles %}
<style>
    html,
    body {
        height: 100%;
    }
    .dash-top{
        width: 100%;
        margin-bottom: 3rem;
        height: 8rem;
        background-color: chocolate;
    }
   
    .greet {
        margin-top: 2rem;
        height: 8rem;
        display: flex;
        flex-direction: column;
        /* background-color:palegoldenrod; */
    }

    .greet{
        align-content: center;
    }

    .container {
        /* background-color:green; */
        padding: auto;
        height: 100vh;
    }

    .row {
        display: flex;
        width: 100%;
        margin: auto;
        margin-top: 1rem;
        flex-direction: row;
        /* background-color: brown; */
    }
    .card{
        box-shadow: 5px 5px 1px #000;
    }

    .card-body {
        color: black;
        font-size: 24px;
        text-decoration: none;
        min-height: 10rem;
        text-overflow: hide;
    }

    /* i {
        font-size: 60px;
    } */
    a, a:hover{
        text-decoration: none;
    }
    .card-body:hover {
        /* background-color: antiquewhite; */
        background-color: #c0eeff;
        text-decoration: none;
    }

    .col-md-4 {
        flex: 0 0 33.333%;
        margin-top: 3em;
        max-width: 33.33%;
        min-width: 200px;
        justify-content: center;
    }

    hr{
        width: 100%;
        margin-top: 5rem;
        border-top: 1px solid #999999;
    }
    .modal{
        top: 0;
        left: 20vw;
    }
    .modal-content{
        width: 60vw;
        /* left: 25%; */
    }
    .modal-body{
        max-width: 60vw;
    }
    #calendar{
        background-color: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0px 0px 2px 0px;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        timeZone: 'UTC',
        editable: true,
        schedulerLicenseKey: '0780359527-fcs-1573633868',
        plugins: [ 'interaction', 'resourceTimeline' ],
        header: {
        left: 'promptResource today prev,next',
        center: 'title',
        right: 'resourceTimelineDay,resourceTimelineWeek'
        },
        resourceAreaWidth: "6rem",
        customButtons: {
        promptResource: {
            text: '+ room',
            click: function() {
            var title = prompt('Room name');
            if (title) {
                calendar.addResource({
                title: title
                });
            }
            }
        }
        },
        // editable: true,
        aspectRatio: 2,
        defaultView: 'resourceTimelineWeek',
        slotLabelInterval:{day:1},
        slotLabelFormat: [
          {month:'numeric', day:'numeric', weekday: 'short'},// lower level of text
        ],
        resourceLabelText: 'Rooms',
        resources: 'https://fullcalendar.io/demo-resources.json?with-nesting',
        events: 'https://fullcalendar.io/demo-events.json?single-day&for-resource-timeline'
    });
    if ("{{LANG}}" == 'zh-hant') {
      calendar.setOption('locale', 'zh-tw');
    }
    calendar.render();
    });
  </script>
{% endblock %}
