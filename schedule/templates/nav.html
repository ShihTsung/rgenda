{% load static %}
{% load i18n %}
{% block nav %}
<!-- custom filter module -->
{% load i18n_switcher %}
{% load notifications_tags %}
{% notifications_unread as unread_count %}
<nav class="navbar navbar-expand-lg navbar-fixed-top navbar-dark" id="navbar">
  <div class="nav_btn" data-toggle="collapse">
    <svg class="icon_color" id="nav_bt" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
      <path d="M24 6h-24v-4h24v4zm0 4h-24v4h24v-4zm0 8h-24v4h24v-4z" /></svg>
  </div>

  <!-- <button class="btn" id="menu-toggle"><i class="fas fa-bars"></i></button>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button> -->

  <div class="navbar-brand col-6 overflow-hidden">睿驊醫院排班</div>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <!-- {% if user.is_superuser%}
            <li class="nav-item">
                <a class="nav-link" href="/admin">{% trans 'Manager' %}</a>
            </li>
            {% endif %} -->
    </ul>

    {% if user.is_authenticated %}
    <div class="btns">
      <notice-list url="{% url 'notice:list' %}" :user-id="{{user.id}}" csrf-token="{{csrf_token}}"></notice-list>

      <div class="dropdown">
        <a class="nav-link dark" href="#" id="navbarDropdown" role="button" data-toggle="dropdown"
          aria-haspopup="true" aria-expanded="false">
          <!-- <i class="fa fa-user" aria-hidden="true"></i> -->
          <svg class="icon_color" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
            viewBox="0 0 24 24">
            <path
              d="M19 7.001c0 3.865-3.134 7-7 7s-7-3.135-7-7c0-3.867 3.134-7.001 7-7.001s7 3.134 7 7.001zm-1.598 7.18c-1.506 1.137-3.374 1.82-5.402 1.82-2.03 0-3.899-.685-5.407-1.822-4.072 1.793-6.593 7.376-6.593 9.821h24c0-2.423-2.6-8.006-6.598-9.819z" />
          </svg>
        </a>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
          <a class="dropdown-item" href="/zh-hant/accounts/{{user.id}}">個人資訊</a>
          <a class="dropdown-item " href="{% url 'logout' %}">{% trans 'Logout' %}</a>
          <!-- <a class="dropdown-item" href="#">個人班表</a> -->

        </div>
      </div>
    </div>

    {% else %}
    <a class="btn btn-primary rightest" href="{% url 'login' %}">{% trans 'Login' %}</a>
    {% endif %}
  </div>

</nav>

<link rel="stylesheet" href="{% static 'css/nav.css' %}">
<script src="{% static 'assets/notice-list.bundle.js' %}"></script>
{% endblock %}
