{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
  <p>請輸入你的新密碼.</p>
  <form action="" method="post">
    <div style="display:none">
      <input type="hidden" value="{{ csrf_token }}" name="csrfmiddlewaretoken">
    </div>
    {{form | crispy}}


    <input class="btn btn-primary" type="submit" value="Change my password" />

  </form>
</div>


{% endblock %}
