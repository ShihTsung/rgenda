<!DOCTYPE html>
<html lang="en">
  {% load static %}
  {% load i18n %}
  {% load crispy_forms_tags %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'bootstrap/bootstrap.min.css' %}">
  <title>送出</title>

  <style>
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 6rem;
        height: 100vh;
    }
    .card {
        background-color: #fff;
        padding: 3rem;
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.8);
        width: 40rem;
        min-width: 20rem;
        color: rgb(5, 7, 50);
    }
    body{
        background-color: #84C0E9 !important;
        font-family: arial,"Microsoft JhengHei","微軟正黑體",sans-serif !important;
      }
      .form-check-label{
        color: #848584;
      }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div><h1>重設密碼信已寄出</h1></div>
      <br>
      <br>
      <div>
        <p>我們已將重設密碼信件寄至您填寫的電子信箱，請依照信中的步驟指示操作即可。</p>
        <p>您將會在數分鐘內收到這封信，如果一直未收到，請確認所填寫的電子信箱是否正確，或檢查您的垃圾信件匣。</p>
      </div>
      <br>
      <br>
     <div>
        <a href="/" class="btn btn-primary"> 返回 </a>
     </div>
    </div>


  </div>
  <script src="{% static "bootstrap/bootstrap.bundle.min.js" %}"></script>
</body>
</html>
