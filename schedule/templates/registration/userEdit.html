{% extends "base.html" %}
{% block title %} Edit User {% endblock %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="title text-center">
                    <h2>Edit User</h2>
                </div>
                {% csrf_token %}
                {% for field in form%}
                    {% if field.name != 'password' %}
                    {{ field |as_crispy_field }}
                    {% endif %}
                {% endfor %}
            <div class="d-flex justify-content-around text-center">
                <a href="/accounts/list" class="btn btn-secondary btn-lg col-3">Cancel</a>
                <button class='btn-primary btn-lg col-md-3' type="submit">update</button>
            </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card{
    margin-top:5rem;
    box-shadow: 1px 1px 2px 0px;
    min-width: 20rem;
    }
    .card-body{
        padding: 5rem 10rem;
    }
</style>
{% endblock %}
