[uwsgi]

# http=0.0.0.0:8000
chdir           = /code/schedule
socket          = schedule.sock
master          = true
# maximum number of worker processes
processes       = 4
threads         = 2
# Django's wsgi file
module          = schedule.wsgi:application

# chmod-socket=664
# uid=www-data
# gid=www-data

# clear environment on exit
vacuum          = true
touch-reload = /code/schedule/schedule/settings.py
py-autoreload = 3
