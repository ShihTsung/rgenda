upstream app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    client_max_body_size 75M;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # React 前端靜態檔
    root /code/frontend/dist;
    index index.html;

    # Django 靜態檔（collectstatic 輸出）
    location /static {
        alias /code/schedule/prod_static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django 媒體檔
    location /images {
        alias /code/schedule/prod_static/images;
        expires 7d;
    }

    # Django — API + 舊 template 介面（i18n prefix） + admin + API docs
    location ~ ^/(api|en|zh-hant|schema|swagger|redoc|mailtest|init)/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size    64k;
        proxy_buffers        32 32k;
        proxy_busy_buffers_size 128k;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
    }

    # Nginx 狀態（限本機）
    location /nginx/status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # 根路徑導向舊版介面（React 未完成，暫時隱藏）
    location = / {
        return 302 /zh-hant/;
    }

    # React SPA — /app/ 開頭才進新版
    location /app/ {
        try_files $uri $uri/ /index.html;
    }
}
