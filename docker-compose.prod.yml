# 生產環境覆蓋設定
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    # 生產環境不對外暴露 DB port
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
